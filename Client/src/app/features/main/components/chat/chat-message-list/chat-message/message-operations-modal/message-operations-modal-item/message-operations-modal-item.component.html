<button>
    <svg class="icon" [style.margin-top]="svgConfig().marginTop" [attr.viewBox]="svgConfig().viewBox" fill="none" stroke="currentColor" stroke-width="2" xmlns="http://www.w3.org/2000/svg">
        <path [attr.d]="svgConfig().path" stroke="currentColor"/>
    </svg>
    <span>
        {{ itemLabel() }}
    </span>
</button>
