<a class="chat-item-container" 
    [class.selected]="selected()" 
    (click)="openChat(chat().id)"
    [routerLink]="['/chats/', chat().id]">
    <div class="image-box">
        <img [src]="chatIcon()" alt="UserImage">
    </div>
    <div class="user-box">
        <h3>{{ chatName() }}</h3>
        <p>{{ chatLastMessageContent() }}</p>
    </div>
    <div class="time-box">
        <p>{{ chatLastMessageTime() }}</p>
    </div>
</a>
