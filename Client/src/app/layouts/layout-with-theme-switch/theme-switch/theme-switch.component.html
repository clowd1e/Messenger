<div class="theme-switch-container"
    [class.hidden]="hideSwitch"
    [class.dark-mode]="isDarkTheme">
    <input type="checkbox" id="theme-switch" hidden
        [checked]="isDarkTheme" (change)="toggleTheme()">
    <label for="theme-switch" role="button">
        <span class="selected-icon-bg"></span>
        <svg class="sun-icon icon"
            width="18" height="18" viewBox="0 0 18 18" fill="currentColor" xmlns="http://www.w3.org/2000/svg">
            <path [attr.d]="sunIcon" fill="currentColor"/>
        </svg>
        <svg class="moon-icon icon" 
            width="19" height="19" viewBox="0 0 19 19" fill="currentColor" xmlns="http://www.w3.org/2000/svg">
            <path [attr.d]="moonIcon" fill="currentColor"/>
        </svg>
    </label>
</div>
